name: Publish to npm (with provenance)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts  # n8n-workflow pulls isolated-vm (native); only its types are needed
      - run: npm run build
      - run: npm test
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Ensure this version is not already on npm
        run: |
          ver="$(node -p "require('./package.json').version")"
          if npm view "n8n-nodes-agentsearch@${ver}" version >/dev/null 2>&1; then
            echo "::error::n8n-nodes-agentsearch@${ver} is already on npm. Bump the version, push, and tag so GitHub Actions can publish it with provenance. Do not npm publish from a laptop."
            exit 1
          fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
